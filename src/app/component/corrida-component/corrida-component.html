<div class="cadastro-corrida">
    <h2>Cadastro de Corrida</h2>
  
    <form>
      <div class="campo">
        <label for="descricao">Descrição da Corrida</label>
        <textarea id="descricao"name="descricao"placeholder="Ex: 5ª Maratona Noturna da Cidade"></textarea>
      </div>
  
      <div class="campo">
        <label for="data">Data da Corrida</label>
        <input
          type="date"
          id="data"
          name="data">
      </div>
  
      <div class="campo">
        <label>Distâncias Disponíveis</label>
  
        <div class="distancias">
          <label>
            <input type="checkbox" name="distancia" value="5">
            5km
          </label>
  
          <label>
            <input type="checkbox" name="distancia" value="10">
          </label>
          10km
          <label>
            <input type="checkbox" name="distancia" value="25">
            25km
          </label>
        </div>
      </div>
  
      <button type="submit">Cadastrar Corrida</button>
    </form>
  </div>
